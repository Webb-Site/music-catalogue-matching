[project]
name = "catalogue-matching"
version = "0.1.0"
description = "Match music recordings to songwriters' works, keep unmatched records with a reason, and estimate royalties at risk."
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "streamlit>=1.40"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.13", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalogue_matching"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["duckdb", "streamlit"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
